<footer id="footer" class="panel">
  <div class="inner split">
    <div>
      <section>
        <h2>About</h2>
        <p>Sophie Li is a Melbourne-based photographer specialising in events and sports. In her spare time she also takes wildlife and nature photography.</p>
      </section>
      {%- include social.html -%}
      <p class="copyright">
        &copy; <a href="mailto:{{ site.email }}">{{ site.author }}</a>. Design: <a href="http://html5up.net">HTML5 UP</a>.
      </p>
    </div>
    <div>
      <section>
        <h2>Get in touch</h2>
        <p>
          <a href="mailto:s.li@outlook.com.au">s.li@outlook.com.au</a>
        </p>
        <h2>Have a passcode?</h2>
          <!-- Client Access -->
          <div style="display: flex; gap: 10px; max-width: 400px; margin-bottom: 2em;">
              <input type="text" id="passcodeInput" placeholder="e.g. MA-10-aug" onkeypress="handleEnter(event)" style="flex-grow: 1;">
              <button class="button primary" onclick="redirectPasscode()">Access</button>
          </div>
          <script>
          function redirectPasscode() {
              const code = document.getElementById("passcodeInput").value.trim().toLowerCase();
              
              if (code) {
                  window.location.href = "/clients/" + code + ".html";
              }
          }
          function handleEnter(event) {
              if (event.key === "Enter") {
                  redirectPasscode();
              }
          }
          </script>

      </section>
    </div>
  </div>
</footer>
